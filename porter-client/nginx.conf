# Rendered by the nginx image's envsubst step (API_UPSTREAM).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers live in a snippet because a location-level add_header discards server-level ones.
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass ${API_UPSTREAM};
  }

  # Hashed build assets can be cached forever.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links like /games/123/play load the app.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
