name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Porter.sln
      - run: dotnet build Porter.sln --no-restore -c Release
      # Integration tests start PostgreSQL via Testcontainers (Docker is available on the runner).
      - run: dotnet test Porter.sln --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: server/TestResults

  frontend:
    name: Frontend · build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porter-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: porter-client/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm run test:ci

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: porter
          POSTGRES_USER: porter
          POSTGRES_PASSWORD: porter
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U porter -d porter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: porter-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: porter-client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: dotnet build ../server/src/Porter.Api
      # playwright.config.ts starts the API (Development settings → localhost:5433) and the Angular dev server.
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: porter-client/playwright-report

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t porter-api ./server
      - run: docker build -t porter-web ./porter-client
